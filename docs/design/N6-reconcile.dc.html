<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abacus — Reconcile (N6 prototype)</title>
<style>
body{margin:0;background:#D9D9DE;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased}
a{color:#0066CC}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
.win{position:relative;width:100%;max-width:1232px;min-height:900px;background:#FFFFFF;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,0.12),0 16px 48px rgba(0,0,0,0.18);overflow:hidden;display:flex;flex-wrap:wrap;align-items:stretch}
.side{flex:1 1 220px;box-sizing:border-box;background:#EDEDF0;border-right:1px solid #D6D6DB;padding:14px 10px 16px;display:flex;flex-direction:column;gap:2px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;background:#FFFFFF}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;padding:6px 10px;border-radius:6px;font-size:13px;min-height:30px;color:#1D1D1F;background:transparent}
.nav.on{background:#D4D4DA;font-weight:500}
.grp{font-size:11px;font-weight:600;color:#6E6E73;padding:6px 10px 4px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #E0E0E5}
.bar h1{margin:0;font-size:17px;font-weight:600}
.btn{border:1px solid #D2D2D7;background:#FFFFFF;font-size:13px;padding:5px 12px;border-radius:6px;min-height:30px;color:#1D1D1F}
.btn:disabled{opacity:.45}
.btn.pri{border:0;background:#0A66D9;color:#FFFFFF;font-weight:500;padding:6px 14px}
.btn.pri:disabled{background:#0A66D9;opacity:.4}
.btn.warn{border:0;background:#B3001B;color:#fff;font-weight:500}
.sel{font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid #D2D2D7;background:#FFFFFF}
.seg{display:flex;border:1px solid #D2D2D7;border-radius:6px;overflow:hidden}
.seg button{border:0;background:#FFFFFF;font-size:12px;padding:5px 11px;min-height:28px;color:#3A3A3C;border-right:1px solid #E5E5EA}
.seg button:last-child{border-right:0}
.seg button.on{background:#E6EEF9;color:#0A4FA8;font-weight:600}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px;width:fit-content;white-space:nowrap}
.sub{font-size:11px;color:#6E6E73}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols-tx{display:grid;grid-template-columns:30px minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) 120px;gap:10px;align-items:center;padding:8px 20px}
.cols-rec{display:grid;grid-template-columns:30px 86px minmax(0,2fr) 220px 130px 110px;gap:10px;align-items:center;padding:8px 20px}
.hd{font-size:11px;font-weight:600;color:#6E6E73;border-bottom:1px solid #ECECF0}
.row{font-size:13px;border-bottom:1px solid #F3F3F6;min-height:40px}
.row.sel-on{background:#F2F7FE}
.day{padding:6px 20px;font-size:12px;font-weight:600;color:#3A3A3C;background:#FAFAFC;border-bottom:1px solid #ECECF0;display:flex;justify-content:space-between}
.tile{flex:1 1 180px;border:1px solid #E5E5EA;border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;background:#fff}
.tile b{font-size:20px;font-weight:600}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:10px;padding:10px 12px;min-height:76px;border:1px solid #E5E5EA;background:#fff}
.card.on{border:1.5px solid #0A66D9;background:#F2F7FE}
.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid #E5E5EA}
.tabs button{border:0;background:transparent;font-size:13px;padding:9px 12px;min-height:36px;border-bottom:2px solid transparent;margin-bottom:-1px;color:#3A3A3C}
.tabs button.on{color:#0A4FA8;font-weight:600;border-bottom-color:#0A66D9}
.item{border:1px solid #E5E5EA;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.item.amber{border-color:#E0B25C;background:#FFFBF2}
.item.red{border-color:#E8A0A8;background:#FFF8F9}
.opt{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.opt label{display:flex;gap:6px;align-items:center}
input[type=text],input[type=date]{font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid #D2D2D7;background:#fff}
.ok{color:#1B6B3A}.bad{color:#B3001B}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid #E0E0E5;margin-top:auto;background:#FAFAFC}
.banner{margin:12px 20px 0;padding:10px 14px;border-radius:8px;font-size:13px;border:1px solid #BFE3CB;background:#E3F4EA;color:#1B6B3A}
.note{margin:0 20px;font-size:12px;color:#6E6E73;line-height:1.45}
.dim{opacity:.5}
.lnk{border:0;background:none;padding:0;font-size:12px;color:#0A4FA8}
.lnk.bad{color:#B3001B}
.lbl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#6E6E73}
</style>
</head>
<body>
<div style="box-sizing:border-box;min-height:960px;padding:24px;display:flex;justify-content:center;">
<div class="win" id="app"></div>
</div>
<script>
(function () {
  // ---- synthetic data (no real names or amounts) -------------------------------------------
  var ACCOUNTS = {
    pko:  { name: 'PKO Personal', cur: 'PLN', opening: 2000.00, kind: 'bank', label: 'Bank account', stmtLabel: 'Statement closing balance' },
    cash: { name: 'Cash PLN',     cur: 'PLN', opening: 300.00,  kind: 'cash', label: 'Cash',         stmtLabel: 'Counted cash' }
  };
  // day = purchase day, booked = bank booking day (PKO), cl = cleared, pend = pending hold
  var TXNS = [
    { id: 't1',  a: 'pko', day: '2026-10-02', booked: '2026-10-02', payee: 'Salary',            cat: 'Income › Salary',     amt: 5000.00, cl: true,  src: 'PKO' },
    { id: 't2',  a: 'pko', day: '2026-10-03', booked: '2026-10-03', payee: 'Rent October',      cat: 'Home › Rent',         amt: -2500.00, cl: true, src: 'PKO' },
    { id: 't3',  a: 'pko', day: '2026-10-05', booked: '2026-10-06', payee: 'Biedronka',         cat: 'Food › Groceries',    amt: -82.40,  cl: true,  src: 'PKO' },
    { id: 't4',  a: 'pko', day: '2026-10-08', booked: '2026-10-08', payee: 'Orange',            cat: 'Bills › Mobile',      amt: -35.00,  cl: true,  src: 'PKO' },
    { id: 't5',  a: 'pko', day: '2026-10-12', booked: null,         payee: 'Coffee beans',      cat: 'Food › Groceries',    amt: -46.00,  cl: false, src: 'Hand-typed' },
    { id: 't6',  a: 'pko', day: '2026-10-14', booked: '2026-10-15', payee: 'City Pharmacy',     cat: 'Health',              amt: -31.20,  cl: true,  src: 'PKO' },
    { id: 't7',  a: 'pko', day: '2026-10-15', booked: '2026-10-15', payee: 'Phone transfer',    cat: 'Gifts',               amt: -200.00, cl: true,  src: 'PKO' },
    { id: 't8',  a: 'pko', day: '2026-10-17', booked: null,         payee: 'Bolt',              cat: 'Transport › Taxi',    amt: -23.40,  cl: false, src: 'PKO', pend: true },
    { id: 't9',  a: 'pko', day: '2026-10-18', booked: '2026-10-19', payee: 'Kawiarnia Relaks',  cat: 'Food › Eating out',   amt: -18.50,  cl: true,  src: 'PKO' },
    { id: 't10', a: 'pko', day: '2026-10-19', booked: null,         payee: 'Bookshop',          cat: 'Leisure › Books',     amt: -64.90,  cl: false, src: 'Hand-typed' },
    { id: 't11', a: 'pko', day: '2026-10-20', booked: '2026-10-20', payee: 'ATM withdrawal',    cat: '→ Cash PLN',          amt: -500.00, cl: true,  src: 'PKO', transfer: true, toCl: false },
    { id: 't12', a: 'pko', day: '2026-10-21', booked: '2026-10-21', payee: 'Biedronka',         cat: 'Food › Groceries',    amt: -17.35,  cl: true,  src: 'PKO' },
    { id: 'c1',  a: 'cash', day: '2026-10-20', booked: null,        payee: 'ATM withdrawal',    cat: '← PKO Personal',      amt: 500.00,  cl: false, src: 'Hand-typed', transfer: true },
    { id: 'c2',  a: 'cash', day: '2026-10-22', booked: null,        payee: 'Market stall',      cat: 'Food › Groceries',    amt: -42.00,  cl: false, src: 'Hand-typed' },
    { id: 'c3',  a: 'cash', day: '2026-10-23', booked: null,        payee: 'Kiosk',             cat: 'Leisure',             amt: -15.00,  cl: false, src: 'Hand-typed' },
    { id: 'c4',  a: 'cash', day: '2026-10-24', booked: null,        payee: 'Tip',               cat: 'Eating out',          amt: -20.00,  cl: false, src: 'Hand-typed' }
  ];
  var CATS = ['Food › Groceries', 'Food › Eating out', 'Transport › Taxi', 'Bills › Mobile', 'Health', 'Leisure', 'Fees', 'Income › Other'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var st = {
    view: 'acc', acct: 'pko', filter: 'all', sel: {},
    phase: 'setup', fromImport: false, ticks: {}, added: [], edits: {}, deleted: {}, settled: {}, editId: null,
    addForm: null, showCleared: false,
    stmt: { pko: { date: '2026-10-21', bal: '3569.55' }, cash: { date: '2026-10-24', bal: '718.00' } },
    lastRec: { pko: null, cash: null },
    done: null,
    impStep: 2, impTab: 'review', sub: 'pending', impCard: 'all', dup: 'link', showHistory: false,
    review: 'expense',
    hold: { h1: null, h2: null }, holdSel: {}, holdEdit: { h1: { amt: '23.40', day: '2026-10-08', pend: true }, h2: { amt: '12.00', day: '2026-10-10', pend: true } },
    gap: { g1a: 'leave', g1b: 'leave' }
  };

  // ---- helpers ------------------------------------------------------------------------------
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function money(v, cur, signed) {
    var s = new Intl.NumberFormat('en-US', { style: 'currency', currency: cur || 'PLN', currencyDisplay: 'narrowSymbol', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(v));
    if (!signed) return (v < 0 ? '−' : '') + s;
    return (v < 0 ? '−' : '+') + s;
  }
  function dayLong(iso) { var p = iso.split('-'); return parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0]; }
  function dayShort(iso) { var p = iso.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  function r2(v) { return Math.round(v * 100) / 100; }
  function parseNum(s) { var n = parseFloat(String(s).replace(/,/g, '.').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; }
  function stmtDay(t) { return t.booked || t.day; }
  // rows of an account including what the open reconciliation has staged (edits, deletions, settled, added)
  function rowsOf(a) {
    return TXNS.concat(st.added).filter(function (t) { return t.a === a && !st.deleted[t.id]; }).map(function (t) {
      var e = st.edits[t.id], o = Object.assign({}, t);
      if (e) { var pa = parseNum(e.amt); o.amt = pa === null ? t.amt : pa; o.day = e.day || t.day; o.edited = true; }
      if (st.settled[t.id]) { o.pend = false; o.settledByHand = true; }
      return o;
    });
  }
  function isCl(t) { return t.cl || !!st.ticks[t.id]; }
  function allRows(a) { return TXNS.filter(function (t) { return t.a === a; }); }
  function balance(a) { return r2(ACCOUNTS[a].opening + allRows(a).reduce(function (s, t) { return s + t.amt; }, 0)); }
  function clearedBal(a, date, live) {
    var rows = live ? rowsOf(a) : allRows(a);
    return r2(ACCOUNTS[a].opening + rows.reduce(function (s, t) {
      var c = live ? isCl(t) : t.cl;
      return s + (c && !t.pend && stmtDay(t) <= date ? t.amt : 0);
    }, 0));
  }
  function notReconciled(a) {
    var l = st.lastRec[a];
    return allRows(a).some(function (t) { return t.cl && !t.pend && (!l || stmtDay(t) > l.date); });
  }
  function hasStaged() { return Object.keys(st.ticks).some(function (k) { return st.ticks[k]; }) || st.added.length || Object.keys(st.edits).length || Object.keys(st.deleted).length || Object.keys(st.settled).length; }
  function clearStaged() { st.ticks = {}; st.added = []; st.edits = {}; st.deleted = {}; st.settled = {}; st.editId = null; st.addForm = null; }

  var ICON = {
    cl: '<svg width="18" height="18" viewBox="0 0 18 18" aria-label="Cleared"><circle cx="9" cy="9" r="7.5" fill="#1B6B3A"/><path d="M5.6 9.2l2.3 2.3 4.5-4.7" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    un: '<svg width="18" height="18" viewBox="0 0 18 18" aria-label="Not cleared"><circle cx="9" cy="9" r="7" fill="none" stroke="#8E8E93" stroke-width="1.5"/></svg>',
    half: '<svg width="18" height="18" viewBox="0 0 18 18" aria-label="Cleared on one account"><circle cx="9" cy="9" r="7" fill="none" stroke="#1B6B3A" stroke-width="1.5"/><path d="M9 2a7 7 0 0 0 0 14z" fill="#1B6B3A"/></svg>',
    pend: '<svg width="18" height="18" viewBox="0 0 18 18" aria-label="Pending at the bank"><circle cx="9" cy="9" r="7" fill="none" stroke="#8A4B00" stroke-width="1.5"/><path d="M9 5v4.2l2.8 1.6" stroke="#8A4B00" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>'
  };
  function indicator(t) {
    if (t.pend) return ICON.pend;
    if (t.transfer) { return (t.cl || t.toCl) && !(t.cl && t.toCl) ? ICON.half : (t.cl ? ICON.cl : ICON.un); }
    return t.cl ? ICON.cl : ICON.un;
  }
  function indTitle(t) {
    if (t.pend) return 'Pending at the bank — uncleared until it settles';
    if (t.transfer && t.cl !== !!t.toCl && (t.cl || t.toCl)) return 'Cleared on ' + (t.cl ? 'PKO Personal' : 'Cash PLN') + ' only';
    return t.cl ? 'Cleared — confirmed by a bank file' : 'Uncleared — not yet seen in a bank file';
  }

  // ---- shell -------------------------------------------------------------------------------
  var NAVI = {
    home: 'M2.5 7.5 8 3l5.5 4.5V13a.5.5 0 0 1-.5.5H10v-4H6v4H3a.5.5 0 0 1-.5-.5z',
    list: 'M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01',
    accounts: 'M2 4.5h12v8H2zM2 7h12M4.5 10h2',
    imp: 'M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 12v1.5h11V12'
  };
  function nav(label, icon, view) {
    var on = st.view === view || (view === 'acc' && st.view === 'rec');
    return '<button type="button" class="nav' + (on ? ' on' : '') + '" data-act="view" data-v="' + view + '"' + (on ? ' aria-current="page"' : '') + '><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + icon + '"></path></svg><span>' + label + '</span></button>';
  }
  function shell(title, toolbar, body, footer) {
    return '<nav class="side" aria-label="Sections">' +
      '<div aria-hidden="true" style="display:flex;gap:8px;padding:2px 8px 18px;"><span style="width:12px;height:12px;border-radius:6px;background:#FF5F57"></span><span style="width:12px;height:12px;border-radius:6px;background:#FEBC2E"></span><span style="width:12px;height:12px;border-radius:6px;background:#28C840"></span></div>' +
      '<div class="grp">Overview</div>' + nav('Dashboard', NAVI.home, 'none') + nav('Transactions', NAVI.list, 'tx') +
      '<div class="grp" style="padding-top:14px">Manage</div>' + nav('Accounts', NAVI.accounts, 'acc') + nav('Import', NAVI.imp, 'imp') +
      '<div style="margin-top:auto;font-size:11px;color:#6E6E73;padding:10px;line-height:1.4">Prototype (N6): synthetic data. Try Accounts → Reconcile…, Transactions, and Import.</div></nav>' +
      '<main class="main"><div class="bar"><h1>' + title + '</h1>' + toolbar + '</div>' + body + (footer || '') + '</main>';
  }
  function acctSelect() {
    return '<select class="sel" aria-label="Account" data-act="acct">' + Object.keys(ACCOUNTS).map(function (k) { return '<option value="' + k + '"' + (k === st.acct ? ' selected' : '') + '>' + ACCOUNTS[k].name + '</option>'; }).join('') + '</select>';
  }

  // ---- 0. Accounts: where Reconcile starts --------------------------------------------------
  function viewAcc() {
    var a = st.acct, acc = ACCOUNTS[a], last = st.lastRec[a];
    var list = Object.keys(ACCOUNTS).map(function (k) {
      var A = ACCOUNTS[k], on = k === a;
      return '<button type="button" data-act="pickacct" data-v="' + k + '" style="display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid #F3F3F6;background:' + (on ? '#F2F7FE' : '#fff') + ';padding:10px 16px;font-size:13px">' +
        '<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><b style="font-weight:600">' + A.name + '</b><span class="sub">' + A.label + ' · ' + A.cur + '</span></span>' +
        '<span style="display:flex;flex-direction:column;gap:3px;align-items:flex-end"><b>' + money(balance(k), A.cur) + '</b>' + (notReconciled(k) ? '<span class="tag" style="background:#FFF1D6;color:#8A4B00">Not reconciled</span>' : '<span class="tag" style="background:#E3F4EA;color:#1B6B3A">Reconciled</span>') + '</span></button>';
    }).join('');
    var cb = clearedBal(a, '9999-12-31', false);
    var insp = '<div style="flex:1 1 320px;padding:18px 22px;display:flex;flex-direction:column;gap:14px">' +
      '<div><h2 style="margin:0;font-size:17px">' + acc.name + '</h2><span class="sub">' + acc.label + ' · ' + acc.cur + '</span></div>' +
      '<div style="display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px"><span class="sub">Balance</span><b>' + money(balance(a), acc.cur) + '</b><span class="sub">Cleared balance</span><b>' + money(cb, acc.cur) + '</b><span class="sub">Uncleared</span><span>' + money(r2(balance(a) - cb), acc.cur) + '</span><span class="sub">Last reconciled</span><span>' + (last ? dayLong(last.date) + ' · ' + money(last.bal, acc.cur) : 'Never') + '</span></div>' +
      (notReconciled(a) ? '<div class="item amber"><b style="font-size:13px">Not reconciled</b><span style="font-size:12px;color:#3A3A3C;line-height:1.45">This account has cleared rows booked after the ' + (last ? 'last reconciliation' : 'start') + '. Compare it with the ' + (acc.kind === 'cash' ? 'cash in your wallet' : 'bank statement') + ' to be sure nothing is missing. This is only a hint.</span></div>' : '') +
      '<div class="item" style="background:#F2F7FE;border-color:#BCD3F2"><b style="font-size:13px">Reconcile this account</b><span style="font-size:12px;color:#3A3A3C;line-height:1.45">' + (acc.kind === 'cash' ? 'Count your cash, type the total, and Abacus shows what differs from its balance.' : 'Type the closing balance from your bank statement and the date it is for. Abacus shows what differs from its cleared rows; you tick, add or fix rows until it matches.') + '</span><span><button type="button" class="btn pri" data-act="startrec">Reconcile…</button></span><span class="sub">Also available: Transactions → Reconcile… (one account filtered), the right-click menu of an account, and after an import.</span></div></div>';
    return shell('Accounts', '<span style="flex-grow:1"></span>', '<div style="display:flex;flex-wrap:wrap;flex-grow:1"><div style="flex:1 1 300px;max-width:400px;border-right:1px solid #ECECF0">' + list + '</div>' + insp + '</div>');
  }

  // ---- 1. Transactions with the cleared column -------------------------------------------
  function viewTx() {
    var a = st.acct, acc = ACCOUNTS[a];
    var rows = allRows(a).filter(function (t) {
      return st.filter === 'all' || (st.filter === 'cleared' ? t.cl : !t.cl);
    }).sort(function (x, y) { return x.day < y.day ? 1 : x.day > y.day ? -1 : 0; });
    var selRows = allRows(a).filter(function (t) { return st.sel[t.id]; });
    var nSel = selRows.length, nPend = selRows.filter(function (t) { return t.pend; }).length;
    var tb = '<span style="flex-grow:1"></span>' + acctSelect() +
      '<div class="seg" role="group" aria-label="Cleared filter">' + [['all', 'All'], ['cleared', 'Cleared'], ['uncleared', 'Uncleared']].map(function (f) { return '<button type="button" data-act="filter" data-v="' + f[0] + '" class="' + (st.filter === f[0] ? 'on' : '') + '">' + f[1] + '</button>'; }).join('') + '</div>' +
      '<button type="button" class="btn" data-act="mark" data-v="1"' + (nSel - nPend > 0 ? '' : ' disabled') + '>Mark cleared</button>' +
      '<button type="button" class="btn" data-act="mark" data-v="0"' + (nSel - nPend > 0 ? '' : ' disabled') + '>Mark uncleared</button>' +
      '<button type="button" class="btn" data-act="settle"' + (nPend ? '' : ' disabled') + ' title="The payment went through; it stays uncleared until a bank row confirms it">Mark settled</button>' +
      '<button type="button" class="btn pri" data-act="startrec">Reconcile…</button>';
    var out = '<div class="cols-tx hd"><span title="Cleared">✓</span><span>Description</span><span>Category</span><span>Account</span><span style="text-align:right">Amount</span></div>';
    var last = '';
    rows.forEach(function (t) {
      if (t.day !== last) { last = t.day; out += '<div class="day"><span>' + dayLong(t.day) + '</span></div>'; }

  }

  // ---- 2. Reconcile: setup, then the working screen ------------------------------------------
  function viewRecSetup() {
    var a = st.acct, acc = ACCOUNTS[a], sm = st.stmt[a], isCash = acc.kind === 'cash', last = st.lastRec[a];
    var from = st.fromImport && a === 'pko' ? 'Filled from the file you just imported (its last booked day and running balance).' : last ? 'Date follows your last reconciliation (' + dayLong(last.date) + '). Type the new balance.' : 'First reconciliation of this account: type the values from your ' + (isCash ? 'count.' : 'statement.');
    var body = '<div style="max-width:660px;padding:24px 20px;display:flex;flex-direction:column;gap:16px">' +
      '<div><h2 style="margin:0 0 6px;font-size:17px">Reconcile ' + acc.name + '</h2><p style="margin:0;font-size:13px;color:#3A3A3C;line-height:1.5">' + (isCash

      '<label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#3A3A3C">' + acc.stmtLabel + ' (' + acc.cur + ')<input type="text" id="f-bal" data-act="bal" value="' + esc(sm.bal) + '" inputmode="decimal" style="width:140px;text-align:right"><span style="font-weight:400;max-width:260px;line-height:1.4;color:#6E6E73">' + (isCash ? 'The total of the notes and coins you counted.' : 'The balance the bank shows at the end of that day. Abacus compares it with the account’s cleared balance on that day.') + '</span></label></div>' +
      '<span class="sub">' + from + '</span>' +
      '<span><button type="button" class="btn pri" data-act="beginrec"' + (parseNum(sm.bal) === null ? ' disabled' : '') + '>Start reconciling</button> <button type="button" class="btn" data-act="view" data-v="acc">Cancel</button></span></div>';
    return shell('Reconcile · ' + acc.name, '<span class="sub" style="flex-grow:1">' + (last ? 'Last reconciled to ' + dayLong(last.date) : 'Never reconciled') + '</span>' + acctSelect(), body);
  }
  function viewRec() {
    if (st.phase === 'setup') return viewRecSetup();
    var a = st.acct, acc = ACCOUNTS[a], sm = st.stmt[a], isCash = acc.kind === 'cash';
    var date = sm.date, closing = parseNum(sm.bal);
    var cleared = clearedBal(a, date, true);
    var diff = closing === null ? null : r2(closing - cleared);
    var rows = rowsOf(a);
    var inRange = rows.filter(function (t) { return stmtDay(t) <= date; });
    var after = rows.filter(function (t) { return stmtDay(t) > date; });
    var byDay = function (x, y) { return stmtDay(x) < stmtDay(y) ? 1 : -1; };
    var todo = inRange.filter(function (t) { return !t.cl; }).sort(byDay);
    var already = inRange.filter(function (t) { return t.cl; }).sort(byDay);
    var nTicked = todo.filter(function (t) { return st.ticks[t.id]; }).length;

    var tb = '<span class="sub" style="flex-grow:1">' + (last ? 'Last reconciled to ' + dayLong(last.date) + ' · ' + money(last.bal, acc.cur) : 'Never reconciled') + '</span>' + acctSelect();
    var head = '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 20px;background:#FAFAFC;border-bottom:1px solid #ECECF0;font-size:13px"><span>' + (isCash ? 'Count date' : 'Statement') + ' <b>' + dayLong(date) + '</b></span><span>' + acc.stmtLabel + ' <b>' + (closing === null ? '—' : money(closing, acc.cur)) + '</b></span><button type="button" class="btn" style="min-height:24px;padding:2px 10px;font-size:12px" data-act="changestmt">Change</button></div>';
    var okDiff = diff !== null && diff === 0;
    var tiles = '<div style="display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px 4px">' +
      '<div class="tile"><span class="sub">' + acc.stmtLabel + '</span><b>' + (closing === null ? '—' : money(closing, acc.cur)) + '</b><span class="sub">at ' + dayLong(date) + '</span></div>' +
      '<div class="tile"><span class="sub">Cleared balance</span><b>' + money(cleared, acc.cur) + '</b><span class="sub">opening ' + money(acc.opening, acc.cur) + ' + cleared rows' + (nTicked ? ' · ' + nTicked + ' ticked now' : '') + '</span></div>' +
      '<div class="tile" style="' + (okDiff ? 'border-color:#BFE3CB;background:#F3FBF6' : 'border-color:#E8A0A8;background:#FFF8F9') + '"><span class="sub">Difference</span><b class="' + (okDiff ? 'ok' : 'bad') + '">' + (diff === null ? '—' : (diff === 0 ? money(0, acc.cur) : money(diff, acc.cur, true))) + '</b><span class="sub ' + (okDiff ? 'ok' : 'bad') + '">' + (diff === null ? 'Enter a balance' : okDiff ? 'Balanced — ready to finish' : (diff < 0 ? 'Statement is lower: a payment is missing from the cleared rows, or a ticked row is not on the statement' : 'Statement is higher: income or a refund is missing from the cleared rows')) + '</span></div></div>';
    var help = okDiff ? '' : '<div class="item" style="margin:10px 20px 0;background:#F2F7FE;border-color:#BCD3F2"><b style="font-size:13px">Ways to make the difference zero</b><ol style="margin:0;padding-left:18px;font-size:12px;line-height:1.6;color:#3A3A3C">' +
      '<li><b>Tick</b> rows that are on the ' + (isCash ? 'count' : 'statement') + ' (hand-typed payments the bank has booked).</li>' +

      '<label class="lbl">Amount (' + acc.cur + '), − for money out<input type="text" id="af-amt" data-act="af" data-k="amt" value="' + esc(st.addForm.amt) + '" style="width:120px;text-align:right" placeholder="-25.00"></label>' +
      '<label class="lbl">Category<select class="sel" data-act="afcat">' + CATS.map(function (c) { return '<option' + (c === st.addForm.cat ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></label>' +
      '<span style="display:flex;gap:8px"><button type="button" class="btn pri" data-act="addsave"' + (parseNum(st.addForm.amt) && st.addForm.desc.trim() ? '' : ' disabled') + '>Add (cleared)</button><button type="button" class="btn" data-act="addcancel">Cancel</button></span></div>' : '';

    function recRow(t, locked) {
      var tick = isCl(t), mine = !t.cl && t.src === 'Hand-typed' || t.staged;
      var state = t.pend ? '<span class="tag" style="background:#FFF1D6;color:#8A4B00">Pending — not on a statement</span>'
        : t.staged ? '<span class="tag" style="background:#E3F4EA;color:#1B6B3A">Added now · cleared</span>'
        : t.cl ? '<span class="tag" style="background:#E3F4EA;color:#1B6B3A">Cleared · ' + esc(t.src) + '</span>'
        : '<span class="tag" style="background:#EEEEF1;color:#6E6E73">' + esc(t.settledByHand ? 'Settled by hand' : t.src) + ' · not cleared</span>' + (t.edited ? ' <span class="sub">edited</span>' : '');
      var acts = '';
      if (!locked) {
        if (t.pend) acts = '<button type="button" class="lnk" data-act="rsettle" data-id="' + t.id + '">Mark settled</button><button type="button" class="lnk bad" data-act="rdel" data-id="' + t.id + '">Delete</button>';
        else if (mine) acts = '<button type="button" class="lnk" data-act="redit" data-id="' + t.id + '">Edit</button><button type="button" class="lnk bad" data-act="rdel" data-id="' + t.id + '">Delete</button>';
      }
      var main = '<div class="cols-rec row' + (st.ticks[t.id] ? ' sel-on' : '') + (locked ? ' dim' : '') + '">' +
        '<input type="checkbox" aria-label="Cleared: ' + esc(t.payee) + '" data-act="tick" data-id="' + t.id + '"' + (tick ? ' checked' : '') + (t.pend || locked || t.staged ? ' disabled' : '') + ' style="width:16px;height:16px">' +
        '<span style="color:#3A3A3C">' + dayShort(stmtDay(t)) + '</span>' +
        '<span style="min-width:0;display:flex;flex-direction:column;gap:1px"><span class="ell">' + esc(t.payee) + '</span><span class="sub ell">' + esc(t.cat) + (t.booked && t.booked !== t.day ? ' · purchased ' + dayShort(t.day) : '') + '</span></span>' +
        '<span>' + state + '</span><span style="display:flex;gap:10px;font-size:12px">' + acts + '</span>' +
        '<span style="text-align:right;font-weight:600;color:' + (t.amt > 0 ? '#1B6B3A' : '#1D1D1F') + '">' + money(t.amt, acc.cur, true) + '</span></div>';
      if (st.editId === t.id) {
        var e = st.edits[t.id] || { amt: t.amt, day: t.day };
        main += '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:8px 20px 10px 60px;background:#F8FBFF;border-bottom:1px solid #F3F3F6"><label class="lbl">Amount<input type="text" id="ed-amt" data-act="ed" data-k="amt" value="' + esc(e.amt) + '" style="width:110px;text-align:right"></label><label class="lbl">Day<input type="date" id="ed-day" data-act="ed" data-k="day" value="' + e.day + '"></label><button type="button" class="btn" data-act="edone">Done</button><span class="sub">Saved when you press Finish.</span></div>';
      }
      return main;
    }
    var body = '<div class="cols-rec hd"><span>✓</span><span>' + (isCash ? 'Date' : 'Booked') + '</span><span>Description</span><span>State</span><span>Actions</span><span style="text-align:right">Amount</span></div>';
    body += '<div class="day"><span>To check (' + todo.length + ') — tick what appears on the ' + (isCash ? 'count' : 'statement') + '</span><span style="display:flex;gap:8px"><button type="button" class="btn" style="min-height:24px;padding:2px 10px;font-size:12px" data-act="addopen">Add transaction…</button><button type="button" class="btn" style="min-height:24px;padding:2px 10px;font-size:12px" data-act="tickall">' + (isCash ? 'Tick all up to the date' : 'Tick all') + '</button></span></div>';
    body += todo.length ? todo.map(function (t) { return recRow(t, false); }).join('') : '<div style="padding:14px 20px;font-size:13px;color:#6E6E73">Nothing left to check up to this date.</div>';
    body += '<div class="day"><span>Already cleared (' + already.length + ')</span><button type="button" class="btn" style="min-height:24px;padding:2px 10px;font-size:12px" data-act="togglecleared">' + (st.showCleared ? 'Hide' : 'Show') + '</button></div>';
    if (st.showCleared) body += already.map(function (t) { return recRow(t, !t.staged); }).join('');
    if (after.length) body += '<div class="day"><span>After the ' + (isCash ? 'count' : 'statement') + ' date (' + after.length + ') — not part of this check</span></div>' + after.map(function (t) { return '<div class="cols-rec row dim"><span></span><span>' + dayShort(stmtDay(t)) + '</span><span class="ell">' + esc(t.payee) + '</span><span class="sub">' + (isCl(t) ? 'Cleared' : 'Not cleared') + '</span><span></span><span style="text-align:right">' + money(t.amt, acc.cur, true) + '</span></div>'; }).join('');

    var drift = '';

    var corrBtn = diff !== null && diff !== 0 ? '<button type="button" class="btn" data-act="finish" data-corr="1">Add correction ' + money(diff, acc.cur, true) + ' and finish</button>' : '';

  }

  // ---- 3. Import --------------------------------------------------------------------------------
  var IMPROWS = [
    { st: 'new', date: '21.10.2026', payee: 'Biedronka', sub: 'Płatność kartą · Warszawa', amt: -17.35, note: 'Imported as cleared' },

  function viewImp() {

      return '<button type="button" class="card' + (on ? ' on' : '') + '" data-act="impcard" data-v="' + c[0] + '" aria-pressed="' + on + '"><span style="font-size:22px;font-weight:600;color:' + c[4] + '">' + c[2] + '</span><span style="font-size:12px;font-weight:500">' + c[1] + '</span><span class="sub">' + c[3] + '</span></button>';
    }).join('') + '</div>';
    var fileBar = '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #ECECF0;background:#FAFAFC"><span style="font-weight:600;font-size:13px">Zestawienie operacji za 21.09.2026 - 21.10.2026.csv</span><span class="tag" style="background:#E6EEF9;color:#0A4FA8">PKO BP statement</span><span class="sub">78 rows · booked 21.09–21.10.2026 · running balance present</span><span style="flex-grow:1"></span><label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#3A3A3C">Import into <select class="sel"><option>PKO Personal · PLN</option></select></label></div>';
    var tabs = '<div role="tablist" class="tabs">' + [['rows', 'Transactions'], ['mapping', 'Accounts & categories'], ['review', 'Needs review (4)']].map(function (t) {
      return '<button type="button" role="tab" aria-selected="' + (st.impTab === t[0]) + '" class="' + (st.impTab === t[0] ? 'on' : '') + '" data-act="imptab" data-v="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
    var main;
    if (st.impTab === 'rows') {
      main = '<div style="display:grid;grid-template-columns:130px 86px minmax(0,2fr) 110px minmax(0,1.6fr);gap:10px;padding:8px 20px;font-size:11px;font-weight:600;color:#6E6E73;border-bottom:1px solid #ECECF0"><span>Status</span><span>Date</span><span>Description</span><span style="text-align:right">Amount</span><span>Category / action</span></div>' +
        IMPROWS.filter(function (r) { return st.impCard === 'all' || st.impCard === r.st; }).map(function (r) {
          var s = STAT[r.st];
          var action = r.dup
            ? '<select class="sel" style="font-size:12px;border-color:#E0B25C;background:#FFFBF2" data-act="dupact"><option value="link"' + (st.dup === 'link' ? ' selected' : '') + '>Link to existing (default)</option><option value="skip"' + (st.dup === 'skip' ? ' selected' : '') + '>Skip</option><option value="import"' + (st.dup === 'import' ? ' selected' : '') + '>Import anyway</option></select><span class="sub ' + (st.dup === 'link' ? 'ok' : '') + '">' + (st.dup === 'link' ? 'Confirms your hand-typed row and marks it cleared' : st.dup === 'skip' ? 'Hand-typed row stays uncleared' : 'Would count the payment twice') + '</span>'
            : '<span class="sub">' + r.note + '</span>';
          return '<div style="display:grid;grid-template-columns:130px 86px minmax(0,2fr) 110px minmax(0,1.6fr);gap:10px;align-items:center;padding:8px 20px;font-size:13px;border-bottom:1px solid #F3F3F6;min-height:40px"><span class="tag" style="background:' + s[1] + ';color:' + s[2] + '">' + s[0] + '</span><span style="color:#3A3A3C">' + r.date + '</span><span style="display:flex;flex-direction:column;min-width:0"><span class="ell">' + esc(r.payee) + '</span><span class="sub ell">' + esc(r.sub) + '</span></span><span style="text-align:right;font-weight:600">' + money(r.amt, 'PLN', true) + '</span><span style="display:flex;flex-direction:column;gap:2px">' + action + '</span></div>';
        }).join('') + '<div style="padding:10px 20px;font-size:12px;color:#6E6E73">Showing sample rows of 78.</div>';
    } else if (st.impTab === 'mapping') {
      main = '<div style="padding:16px 20px;font-size:13px;color:#3A3A3C">Unchanged from the approved import screen (account and category mapping).</div>';
    } else {
      var nSelH = HOLDS.filter(function (h) { return st.holdSel[h[0]]; }).length;
      var subs = '<div class="seg" role="tablist" aria-label="Needs review" style="margin:14px 20px 0;width:fit-content">' + [['decisions', 'Decisions (1)'], ['pending', 'Pending payments (' + HOLDS.length + ')'], ['gaps', 'Balance gaps (1)']].map(function (t) {
        return '<button type="button" role="tab" aria-selected="' + (st.sub === t[0]) + '" class="' + (st.sub === t[0] ? 'on' : '') + '" data-act="sub" data-v="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>';
      var inner;
      if (st.sub === 'decisions') {
        inner = '<p style="margin:0;font-size:12px;color:#6E6E73">Rows the importer could not place confidently. Each needs a decision before importing.</p><div class="item"><div style="display:flex;justify-content:space-between"><b style="font-size:13px">Unknown operation type</b><span class="sub">15.10.2026</span></div><span style="font-size:12px;color:#3A3A3C;line-height:1.45">“Przelew na telefon przychodz. zew.”, −200.00 PLN. The sign says money went out.</span><div class="opt">' + [['expense', 'Expense'], ['transfer', 'Transfer to my account'], ['skip', 'Skip']].map(function (o) { return '<label><input type="radio" name="rv" data-act="review" data-v="' + o[0] + '"' + (st.review === o[0] ? ' checked' : '') + '> ' + o[1] + '</label>'; }).join('') + '</div></div>';
      } else if (st.sub === 'pending') {
        inner = '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-act="holdall" style="width:16px;height:16px"' + (nSelH === HOLDS.length ? ' checked' : '') + '> Select all</label><span style="display:flex;gap:8px;align-items:center"><span class="sub">' + nSelH + ' selected</span><button type="button" class="btn" data-act="holdbulk" data-v="keep"' + (nSelH ? '' : ' disabled') + '>Keep pending</button><button type="button" class="btn" data-act="holdbulk" data-v="settle"' + (nSelH ? '' : ' disabled') + '>Mark settled</button><button type="button" class="btn" data-act="holdbulk" data-v="del"' + (nSelH ? '' : ' disabled') + '>Delete</button><button type="button" class="btn" data-act="keepall">Keep all</button></span></div>' +
          '<p style="margin:0;font-size:12px;color:#6E6E73;line-height:1.45">Holds from earlier imports that this file should have settled (value day at least 5 days before its last booked day, 21.10) and did not. Each needs a decision before you import. The count is kept on the import record, which is how you see whether such cases happen at all.</p>' + HOLDS.map(holdItem).join('');
      } else {
        inner = '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><b style="font-size:13px">Balance continuity: 1 gap</b><button type="button" class="btn" data-act="gapleaveall">Leave all</button></div>' +
          '<div class="item red"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><b style="font-size:13px" class="bad">Rows may be missing between 14.10 and 16.10</b><span class="tag" style="background:#FDE7EA;color:#B3001B">Balance gap −210.00 PLN</span></div>' + gapTable() +
          '<span style="font-size:12px;color:#3A3A3C;line-height:1.45">The balance after 14.10 is 4,351.40 but the next row starts from 4,141.40: rows adding up to −210.00 are not in this file. <b>Leave</b> imports a row as the file says; <b>Remove</b> does not import it (for example to export a corrected period and import again). This is a warning; it never blocks the import.</span></div>' +
          '<div class="item" style="background:#F3FBF6;border-color:#BFE3CB"><b style="font-size:13px" class="ok">File start matches PKO Personal</b><span style="font-size:12px;color:#3A3A3C;line-height:1.45">The oldest row starts from 2,000.00 PLN; the cleared balance of PKO Personal on 20.09.2026 is 2,000.00 PLN. (If it differed, a warning would say by how much.)</span></div>';

  // ---- render + events ---------------------------------------------------------------------
  var app = document.getElementById('app');
  function render() {
    var fa = document.activeElement, fid = fa && fa.id, pos = fa && fa.selectionStart;
    app.innerHTML = st.view === 'tx' ? viewTx() : st.view === 'imp' ? viewImp() : st.view === 'rec' ? viewRec() : viewAcc();
    if (fid) { var el = document.getElementById(fid); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} } }
  }
  function openRec(fromImport) { st.view = 'rec'; st.phase = 'setup'; st.fromImport = !!fromImport; st.done = null; clearStaged(); }
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act'), v = t.getAttribute('data-v'), id = t.getAttribute('data-id');
    if (t.tagName === 'INPUT' || t.tagName === 'SELECT') return;
    if (act === 'view') {
      if (st.view === 'rec' && hasStaged() && !confirm('Discard the staged changes of this reconciliation?')) return;
      clearStaged(); st.view = v === 'none' ? 'tx' : v;
    }
    else if (act === 'pickacct') st.acct = v;
    else if (act === 'startrec') openRec(false);
    else if (act === 'beginrec') { st.phase = 'work'; }
    else if (act === 'changestmt') { st.phase = 'setup'; }
    else if (act === 'cancelrec') { clearStaged(); st.view = 'acc'; }
    else if (act === 'filter') st.filter = v;
    else if (act === 'select') st.sel[id] = !st.sel[id];
    else if (act === 'mark') { TXNS.forEach(function (x) { if (st.sel[x.id] && !x.pend) x.cl = v === '1'; }); st.sel = {}; }
    else if (act === 'settle') { TXNS.forEach(function (x) { if (st.sel[x.id] && x.pend) { x.pend = false; x.settledByHand = true; } }); st.sel = {}; }
    else if (act === 'tickall') { rowsOf(st.acct).forEach(function (x) { if (!x.cl && !x.pend && stmtDay(x) <= st.stmt[st.acct].date) st.ticks[x.id] = true; }); }
    else if (act === 'togglecleared') st.showCleared = !st.showCleared;
    else if (act === 'addopen') { st.addForm = { day: st.stmt[st.acct].date, desc: '', amt: '', cat: CATS[0] }; }
    else if (act === 'addcancel') st.addForm = null;
    else if (act === 'addsave') { var af = st.addForm; st.added.push({ id: 'new' + Date.now(), a: st.acct, day: af.day, booked: af.day, payee: af.desc.trim(), cat: af.cat, amt: parseNum(af.amt), cl: true, src: 'Added', staged: true }); st.addForm = null; }
    else if (act === 'redit') { var cur = rowsOf(st.acct).filter(function (x) { return x.id === id; })[0]; st.edits[id] = st.edits[id] || { amt: cur.amt, day: cur.day }; st.editId = id; }
    else if (act === 'edone') { var ed = st.edits[st.editId]; if (ed) { ed.amt = parseNum(ed.amt); if (ed.amt === null) delete st.edits[st.editId]; } st.editId = null; }
    else if (act === 'rdel') { if (confirm('Delete this row when you finish the reconciliation?')) { if (String(id).indexOf('new') === 0) st.added = st.added.filter(function (x) { return x.id !== id; }); else st.deleted[id] = true; } }
    else if (act === 'rsettle') st.settled[id] = true;
    else if (act === 'finish') {
      var a = st.acct, sm = st.stmt[a], cleared = clearedBal(a, sm.date, true), closing = parseNum(sm.bal), diff = r2(closing - cleared), n = 0;
      var live = rowsOf(a);
      live.forEach(function (x) { if (st.ticks[x.id]) n++; });
      TXNS.forEach(function (x) { if (x.a === a && st.ticks[x.id]) x.cl = true; if (st.settled[x.id]) { x.pend = false; x.settledByHand = true; n++; } if (st.edits[x.id]) { x.amt = st.edits[x.id].amt; x.day = st.edits[x.id].day; n++; } });
      st.added.forEach(function (x) { if (x.a === a && !st.deleted[x.id]) { x.staged = false; TXNS.push(x); n++; } });
      TXNS = TXNS.filter(function (x) { if (st.deleted[x.id]) { n++; return false; } return true; });
      var corr = 0;
      if (t.getAttribute('data-corr') && diff !== 0) { TXNS.push({ id: 'corr' + Date.now(), a: a, day: sm.date, booked: sm.date, payee: 'Balance correction', cat: 'Not income or expense', amt: diff, cl: true, src: 'Correction' }); corr = diff; n++; }
      clearStaged();
      st.lastRec[a] = { date: sm.date, bal: closing };
      st.done = { a: a, date: sm.date, bal: closing, n: n, corr: corr };
    }
    else if (act === 'imptab') { st.impTab = v; if (v === 'rows') st.impCard = 'all'; }
    else if (act === 'sub') st.sub = v;
    else if (act === 'impcard') { if (v === 'pending' || v === 'gaps') { st.impTab = 'review'; st.sub = v; } else if (v === 'review') { st.impTab = 'review'; st.sub = 'decisions'; } else { st.impTab = 'rows'; st.impCard = v; } }
    else if (act === 'keepall') { st.hold.h1 = 'keep'; st.hold.h2 = 'keep'; }
    else if (act === 'holdbulk') { HOLDS.forEach(function (h) { if (st.holdSel[h[0]]) st.hold[h[0]] = v; }); st.holdSel = {}; }
    else if (act === 'gapleaveall') { st.gap = { g1a: 'leave', g1b: 'leave' }; }
    else if (act === 'commit') st.impStep = 3;
    else if (act === 'history') st.showHistory = !st.showHistory;
    else if (act === 'choosefile') { st.impStep = 1; st.hold = { h1: null, h2: null }; st.holdSel = {}; st.gap = { g1a: 'leave', g1b: 'leave' }; }
    else if (act === 'pickpko') { st.impStep = 2; st.impTab = 'review'; st.sub = 'pending'; st.impCard = 'all'; }
    else if (act === 'goreconcile') { st.acct = 'pko'; st.stmt.pko = { date: '2026-10-21', bal: '3569.55' }; st.view = 'rec'; st.phase = 'setup'; st.fromImport = true; st.done = null; clearStaged(); }
    render();
  });
  app.addEventListener('change', function (e) {
    var t = e.target, act = t.getAttribute('data-act'), id = t.getAttribute('data-id'); if (!act) return;
    if (act === 'acct') { if (st.view === 'rec' && hasStaged() && !confirm('Discard the staged changes of this reconciliation?')) { render(); return; } clearStaged(); st.acct = t.value; st.done = null; if (st.view === 'rec') { st.phase = 'setup'; st.fromImport = false; } }
    else if (act === 'tick') st.ticks[id] = t.checked;
    else if (act === 'hold') st.hold[id] = t.getAttribute('data-v');
    else if (act === 'holdsel') st.holdSel[id] = t.checked;
    else if (act === 'holdall') { HOLDS.forEach(function (h) { st.holdSel[h[0]] = t.checked; }); }
    else if (act === 'hpend') st.holdEdit[id].pend = t.checked;
    else if (act === 'dupact') st.dup = t.value;
    else if (act === 'review') st.review = t.getAttribute('data-v');
    else if (act === 'gap') st.gap[t.getAttribute('data-k')] = t.value;
    else if (act === 'afcat') st.addForm.cat = t.value;
    render();
  });
  app.addEventListener('input', function (e) {
    var t = e.target, act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act === 'bal') st.stmt[st.acct].bal = t.value;
    else if (act === 'date') { if (t.value) st.stmt[st.acct].date = t.value; else return; }
    else if (act === 'hedit') st.holdEdit[id][t.getAttribute('data-k')] = t.value;
    else if (act === 'af') st.addForm[t.getAttribute('data-k')] = t.value;
    else if (act === 'ed') { st.edits[st.editId][t.getAttribute('data-k')] = t.value; }
    else return;
    st.done = null;
    render();
  });
  render();
})();
