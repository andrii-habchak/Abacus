name: CI

on:
  push:
    branches: [main, "wp/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 26 runner: ships an Xcode with the macOS 26 SDK the app targets.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test AbacusKit
        working-directory: AbacusKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build app (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project Abacus.xcodeproj \
            -scheme Abacus \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build
